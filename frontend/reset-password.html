<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đặt lại mật khẩu — Meeting Room Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./login-page.css?v=8" />
  </head>
  <body class="account-page page-shell account-page--customer">
    <div class="account-bg" aria-hidden="true"></div>

    <div class="account-wrap">
      <div class="account-back-row">
        <a href="./login.html" class="account-back-link">← Về trang đăng nhập</a>
      </div>
      <div class="account-card">
        <div class="account-card-header">
          <p class="account-brand">Meeting Room Pro</p>
          <h1>Đặt lại mật khẩu</h1>
          <p class="account-card-subtitle">Nhập mật khẩu mới cho tài khoản của bạn</p>
        </div>

        <div class="account-card-body">
          <div id="resetInvalid" class="account-forgot-result hidden" role="alert"></div>

          <form id="resetForm" class="account-panel">
            <input type="hidden" id="resetToken" />
            <label class="account-field account-field--plain">
              <input
                id="resetPassword"
                type="password"
                class="account-input"
                placeholder="Mật khẩu mới (tối thiểu 6 ký tự)"
                autocomplete="new-password"
              />
            </label>
            <label class="account-field account-field--plain">
              <input
                id="resetPasswordConfirm"
                type="password"
                class="account-input"
                placeholder="Xác nhận mật khẩu mới"
                autocomplete="new-password"
              />
            </label>
            <button type="submit" id="btnResetPassword" class="account-btn">Lưu mật khẩu mới</button>
          </form>
        </div>
      </div>
    </div>

    <script src="./shared.js?v=11"></script>
    <script src="./reset-password.js"></script>
  </body>
</html>
